{% extends 'base.html' %}

{% block title %}Balnex | Crear Cuenta{% endblock %}

{% block contenido %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 p-4 w-full">

    <div class="w-full max-w-md rounded-2xl border border-gray-200 bg-white shadow-sm overflow-hidden">
        <div class="p-8 md:p-10">
            <div class="text-center mb-10">
                <h1 class="text-3xl font-extrabold tracking-tight text-indigo-600">
                    Bal<span class="text-pink-500">Nex</span>
                </h1>
                <p class="text-gray-500 mt-2 font-medium">Crear cuenta</p>
            </div>

            <form method="POST" class="space-y-6" autocomplete="on">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">Usuario</label>
                    <input type="text" name="username" autocomplete="username" value="{{ username }}" required
                        minlength="3" maxlength="{{ FORM_LIMITS.username }}" pattern="[A-Za-z0-9_.-]{3,30}"
                        class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none transition-all"
                        placeholder="tu_usuario">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">Correo Electrónico</label>
                    <input type="email" name="correo" autocomplete="email" value="{{ correo }}" required
                        maxlength="{{ FORM_LIMITS.email }}"
                        class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none transition-all"
                        placeholder="ejemplo@balnex.com">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">Contraseña</label>
                    <input type="password" name="password" autocomplete="new-password" required
                        minlength="{{ FORM_LIMITS.password_min }}" maxlength="{{ FORM_LIMITS.password }}"
                        class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none transition-all"
                        placeholder="••••••••">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">Confirmar contraseña</label>
                    <input type="password" name="confirmar_password" autocomplete="new-password" required
                        minlength="{{ FORM_LIMITS.password_min }}" maxlength="{{ FORM_LIMITS.password }}"
                        class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none transition-all"
                        placeholder="••••••••">
                </div>

                {% if error %}
                <p class="text-red-500 text-sm text-center">{{ error }}</p>
                {% endif %}

                <button type="submit"
                    class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-base hover:bg-indigo-700 transition-all active:scale-[0.99]">
                    Registrarse
                </button>
            </form>

            <div class="mt-10 text-center">
                <p class="text-sm text-gray-500">¿Ya tienes cuenta?
                    <a href="{% url 'login' %}" class="text-pink-500 font-bold hover:underline">
                        Inicia sesión
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock contenido %}
